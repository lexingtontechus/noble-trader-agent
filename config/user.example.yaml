# User Configuration Template
# Copy this file to user.local.yaml and customize for your deployment
# This file is git-ignored and contains tenant-specific overrides only.
#
# ───────────────────────────────────────────────────────────────────────────
# Configuration Separation (see worklog_user_vs_system_vars.md):
#   - System endpoints (URLs, infrastructure) → config/system_endpoints.yaml
#   - System defaults (venues, execution, notifications, risk) → config/default.yaml
#   - User secrets (API keys, tokens) → .env / .env.local
#   - User overrides (portfolio allocation, active hours) → config/user.local.yaml
# ───────────────────────────────────────────────────────────────────────────
#
# The onboarding wizard (platform setup) can auto-generate this file from your
# portfolio preferences. You can also edit it manually — changes require a
# restart to take effect (config loads at startup).

# ============================================================================
# Portfolio Configuration (tenant-specific)
# ============================================================================
portfolio:
  # Target asset allocation — adjust to your risk preferences.
  # These override the defaults in config/default.yaml.
  target_allocation:
    crypto: 0.15
    equities: 0.30
    commodities: 0.30
    forex: 0.25
  rebalance_threshold_drift_pct: 0.1
  rebalance_frequency: on_drift
  rebalance_method: threshold
  start_smart: true

# ============================================================================
# Active Hours (tenant-specific — your locale/timezone)
# ============================================================================
# Determines when stock sessions are active and drives TradingView WS windows.
# All schedule math (autonomy, TradingView WS) binds to THIS timezone.
active_hours:
  timezone: America/Los_Angeles
  start: 09:30
  end: '16:00'
  crypto_24_7: true
  degrade_outside_hours: true
